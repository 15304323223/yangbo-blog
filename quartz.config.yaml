# Quartz 5 站点配置 —— 后端技术沉淀
# 数据源：Obsidian Vault / 01_技术库_Java开发（通过 sync-content.js 同步到 content/）
# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

configuration:
  pageTitle: 后端技术沉淀
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # 不启用分析，避免向第三方发送访客数据
  analytics: null
  locale: zh-CN
  baseUrl: 15304323223.github.io/yangbo-blog
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .sync-manifest.json

  theme:
    # 用本地系统字体，避免国内访问 Google Fonts 缓慢/超时
    # 注意：typography 需填「单个有效字体名」，OG 图片生成器会用它渲染；
    #       实际的网页中文字体栈在 quartz/styles/custom.scss 里定义
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Noto Sans SC
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#f2f4f7"
        gray: "#8b949e"
        darkgray: "#3d4451"
        dark: "#1f2328"
        secondary: "#1f6feb"
        tertiary: "#0d9488"
        highlight: rgba(31, 111, 235, 0.12)
        textHighlight: "#fff3a388"
      darkMode:
        light: "#16181d"
        lightgray: "#252932"
        gray: "#7d8590"
        darkgray: "#c9d1d9"
        dark: "#e6edf3"
        secondary: "#58a6ff"
        tertiary: "#2dd4bf"
        highlight: rgba(88, 166, 255, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    options:
      # 中文笔记里表格较多，开启换行支持更稳妥
      enableSmartyPants: false
    order: 40

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      # 笔记里的双链大多不带路径，必须用 shortest 才能解析
      markdownLinkResolution: shortest
    order: 60

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/citations"
    enabled: false
    order: 85

  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90

  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91

  - source: "@quartz-community/roam"
    enabled: false
    order: 92

  - source: "@quartz-community/quartz-fonts"
    enabled: false

  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both

  - source: "@quartz-community/remove-draft"
    enabled: true

  - source: "@quartz-community/explicit-publish"
    enabled: false

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/og-image"
    enabled: true

  - source: "@quartz-community/cname"
    enabled: false

  - source: "@quartz-community/canvas-page"
    enabled: true

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  # 笔记带 24 种技术标签，开启标签展示更利于导航
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/15304323223
        RSS: /yangbo-blog/index.xml
    layout:
      position: footer
      priority: 50

  - source: "@quartz-community/recent-notes"
    enabled: false

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50

  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900

  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
